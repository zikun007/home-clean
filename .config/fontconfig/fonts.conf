<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  旧版字体家族名 -> 当前 Nerd Font v3 家族名
  背景：本仓库早期使用 Nerd Fonts v2 补丁的 "FiraCode Nerd Font"（单 Medium 字重），
  已替换为 v3.5.1 的 "FiraCode Nerd Font Mono"。若不映射，任何仍保存旧名的配置
  都会静默回退到 Noto Sans CJK，表现为"FiraCode 显示不出来"。
-->
<fontconfig>
  <alias binding="same">
    <family>FiraCode Nerd Font</family>
    <prefer><family>FiraCode Nerd Font Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Fira Code</family>
    <prefer><family>FiraCode Nerd Font Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Fira Code Medium Nerd Font Complete</family>
    <prefer><family>FiraCode Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>
